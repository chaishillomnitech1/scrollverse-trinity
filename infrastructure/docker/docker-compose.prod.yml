version: '3.9'

# ============================================================
# SCROLLVERSE TRINITY SOVEREIGN ECOSYSTEM
# Production Docker Compose - Full Stack
# ============================================================

services:
  # ─── API Server ──────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    image: scrollverse-api:3.0.0
    container_name: scrollverse_api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - METRICS_PORT=9090
    env_file:
      - ../../backend/.env
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scrollverse_net
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ─── MySQL Primary ────────────────────────────────────────
  mysql-primary:
    image: mysql:8.0
    container_name: scrollverse_mysql_primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf
    networks:
      - scrollverse_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  # ─── MySQL Replica ────────────────────────────────────────
  mysql-replica:
    image: mysql:8.0
    container_name: scrollverse_mysql_replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf
    depends_on:
      - mysql-primary
    networks:
      - scrollverse_net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  # ─── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scrollverse_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - scrollverse_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx Load Balancer ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: scrollverse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - scrollverse_net

  # ─── Prometheus Monitoring ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: scrollverse_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - scrollverse_net

  # ─── Grafana Dashboard ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: scrollverse_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=monitoring.scrollverse.app
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - scrollverse_net

volumes:
  mysql_primary_data:
  mysql_replica_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  scrollverse_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
